<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jerome — Original Voice Review</title><style>body{margin:0;background:#10221e;color:#f4ead4;font:17px system-ui}main{max-width:680px;margin:auto;padding:24px}h1{font-family:Georgia,serif;color:#dfc98e}button,select,a{font:inherit}button,select{padding:12px;border:1px solid #b8a16b;border-radius:8px;background:#173c32;color:#fff;margin:5px;min-height:46px}section{border-top:1px solid #567061;padding:18px 0}audio{width:100%;margin:14px 0}a{color:#e5d29b}small{color:#c7cbbb}#line{min-height:2em;overflow-wrap:anywhere}</style><main><h1>Jerome’s original voice</h1><p>Each button plays one take. Tap again to hear the next variation.</p><audio id="player" controls></audio><p id="line" aria-live="polite">Choose a line below.</p><section><button data-action="shootMoon">Shoot the Moon</button><button data-action="pass">Pass</button><br><select id="amount" aria-label="Bid amount"></select><button id="bid">Hear bid</button></section><section><button data-action="trump" data-value="red">Red trump</button><button data-action="trump" data-value="green">Green trump</button><button data-action="trump" data-value="black">Black trump</button><button data-action="trump" data-value="yellow">Yellow trump</button></section><section><button data-action="made">Made our bid</button><button data-action="gotSet">We got set</button><button data-action="setOpponent">Set opponents</button><button data-action="matchWin">Game won</button><button data-action="matchLose">Game lost</button></section><p><a href="index.html">Open the review game</a></p><small>Original recordings. One audio player. Game voice mute and volume still apply inside the game.</small></main><script src="jerome-voice-lines.js?v=jerome-voice-review-20261015"></script><script>const player=document.getElementById('player'),amount=document.getElementById('amount');for(let n=100;n<=195;n+=5)amount.add(new Option(n,n));function play(action,value){player.pause();player.currentTime=0;const path=HORJeromeVoiceLines.resolve('jerome',action,value);player.src=path;document.getElementById('line').textContent=action+(value?' · '+value:'')+' · '+path.split('/').pop();player.play().catch(()=>document.getElementById('line').textContent='Tap Play on the audio control.');}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>play(b.dataset.action,b.dataset.value));document.getElementById('bid').onclick=()=>play('bid',amount.value);</script></html>
